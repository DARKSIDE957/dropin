<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" flood-color="#1e1b4b" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Box Bracket / Package Container -->
  <path d="M38 68 V86 C38 88.2 39.8 90 42 90 H86 C88.2 90 90 88.2 90 86 V68" 
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  
  <!-- Smooth Animated-feel Downward Arrow -->
  <path d="M64 36 V72" stroke="url(#arrowGrad)" stroke-width="7.5" stroke-linecap="round" />
  <path d="M49 57 L64 72 L79 57" fill="none" stroke="url(#arrowGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle accent dot -->
  <circle cx="64" cy="27" r="3.5" fill="#ffffff" opacity="0.8" />
</svg>
